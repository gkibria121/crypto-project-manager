name: pulseos-dev-infra

services:
  postgres:
    image: postgres:16-alpine
    container_name: pulseos-postgres-dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pulseos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulseos_secret}
      POSTGRES_DB: ${POSTGRES_DB:-pulseos}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-pulseos} -d ${POSTGRES_DB:-pulseos}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_dev_data:
